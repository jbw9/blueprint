[package]
name = "bluprint"
version = "0.1.0"
edition = "2021"

[lib]
name = "bluprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: the preview opens pages from the web in a webview of their own (src/browser.rs).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"
# On-device dictation, Handy's own engine (src/dictate.rs): the microphone at
# 16 kHz mono, and a speech model run locally (Metal on Apple Silicon).
handy-recorder = "0.1"
transcribe-cpp = "0.4"

# A job object per terminal tab, so ending the tab ends everything its shell started (src/pty.rs).
# Already in the build through tauri; named here to call it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# A picture of a page from the web, to stand in for it under a menu (src/browser.rs).
# Already in the build through wry; named here to call them.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

# The webview's own widget, to take a touchpad pinch before WebKitGTK does (src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# The preview's screenshot for Claude, WebKit's own snapshot of the window
# (src/mcp.rs), and Claude's clicks and keys as AppKit events (src/browser.rs).
# Already in the build through wry; named here to call them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
