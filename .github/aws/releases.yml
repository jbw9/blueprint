AWSTemplateFormatVersion: "2010-09-09"
# Where install.sh and the installed app download Blueprint from (.github/workflows/release.yml uploads
# to it). Deployed by hand in 891376942131, by someone allowed to make buckets and roles:
#   aws cloudformation deploy --stack-name blueprint-releases --template-file .github/aws/releases.yml \
#     --capabilities CAPABILITY_NAMED_IAM --region us-east-1
# then: gh variable set AWS_RELEASE_ROLE --body "$(aws cloudformation describe-stacks --stack-name \
#   blueprint-releases --region us-east-1 --query 'Stacks[0].Outputs[0].OutputValue' --output text)"
Description: Blueprint's public release downloads, and the role release.yml publishes them with.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: blueprint-releases-891376942131
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
          # A system with no release then gets 404, not 403, which install.sh takes to build from source.
          - Effect: Allow
            Principal: "*"
            Action: s3:ListBucket
            Resource: !GetAtt Bucket.Arn

  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blueprint-release
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:jbw9@143005445/blueprint@1368580503:ref:refs/tags/v*
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # s3 cp between keys copies large files in parts, carrying their tags over.
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectTagging, s3:PutObjectTagging]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn

Outputs:
  ReleaseRoleArn:
    Value: !GetAtt ReleaseRole.Arn
