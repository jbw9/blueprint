name: Install

# The landing page's one-line install, run as a visitor runs it, on each system it names: built from
# source, then packed as a release and installed again from that. On main the release is published as
# `latest`, which install.sh downloads instead of building.
on:
  push:
    paths:
      - install.sh
      - app/**
      - .github/workflows/install.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: a binary built against an older glibc runs on more systems.
        os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
      BLUEPRINT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # What install.sh asks a Debian or Ubuntu user to install.
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libasound2-dev libpulse-dev

      - name: Install from source
        run: curl -fsSL "$RAW/install.sh" | BLUEPRINT_FROM_SOURCE=1 sh

      - name: Check
        run: sh .github/scripts/check-install.sh

      - name: Pack
        run: echo "PACK=$(sh .github/scripts/pack-release.sh)" >> "$GITHUB_ENV"

      - name: Install from the release
        run: |
          # A file URL as Windows' curl reads one: file:///D:/a/... there, file:///home/... elsewhere.
          file=$(cygpath -m "$PACK" 2>/dev/null || echo "$PACK")
          case $file in /*) url=file://$file ;; *) url=file:///$file ;; esac
          curl -fsSL "$RAW/install.sh" | BLUEPRINT_RELEASE="$url" sh

      - name: Check the release
        run: sh .github/scripts/check-install.sh

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every system's job gets here; the first makes the release.
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create latest -R "$GITHUB_REPOSITORY" --title Blueprint --notes "What install.sh downloads: main as it was built on its last push." ||
            gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload latest "$PACK" -R "$GITHUB_REPOSITORY" --clobber
