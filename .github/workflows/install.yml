name: Install

# The landing page's one-line install, run as a visitor runs it, on each system it names: built from
# source, then packed as a release, installed again from that, and updated in place as the installed
# app updates itself. A version tag runs it from release.yml, which publishes what it packs.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    paths:
      - install.sh
      - app/**
      - .github/workflows/install.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: a binary built against an older glibc runs on more systems.
        os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
      BLUEPRINT_REF: ${{ github.sha }}
      BLUEPRINT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # What install.sh asks a Debian or Ubuntu user to install.
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libasound2-dev libpulse-dev

      - name: Install from source
        run: curl -fsSL "$RAW/install.sh" | BLUEPRINT_FROM_SOURCE=1 sh

      - name: Check
        run: sh .github/scripts/check-install.sh

      - name: Pack
        run: echo "PACK=$(sh .github/scripts/pack-release.sh)" >> "$GITHUB_ENV"

      # With the Node install.sh gets for someone whose Node is missing or old, as the app would run on.
      - name: Install from the release
        run: |
          # A file URL as Windows' curl reads one: file:///D:/a/... there, file:///home/... elsewhere.
          file=$(cygpath -m "$PACK" 2>/dev/null || echo "$PACK")
          case $file in /*) url=file://$file ;; *) url=file:///$file ;; esac
          curl -fsSL "$RAW/install.sh" | BLUEPRINT_RELEASE="$url" BLUEPRINT_PRIVATE_NODE=1 sh

      - name: Check the release
        run: |
          sh .github/scripts/check-install.sh
          sh .github/scripts/check-install.sh --private-node

      # The updater this release ships, run on the release itself: an updater that can't update
      # would leave everyone on this version.
      - name: Update the release
        run: sh .github/scripts/check-update.sh "$PACK"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: bare-linux-release
          path: ${{ env.PACK }}
          compression-level: 0
          retention-days: 1

      - name: Keep the release
        if: inputs.version
        id: keep
        run: echo "path=$(cygpath -m "$PACK" 2>/dev/null || echo "$PACK")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: inputs.version
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.keep.outputs.path }}
          compression-level: 0

  # A Linux with nothing on it, not even Node or WebKit, as a fresh server or container has: install.sh
  # installs what's missing itself. Root here, so it needs no sudo.
  bare-linux:
    needs: install
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
    steps:
      - run: apt-get update && apt-get install -y curl ca-certificates
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: bare-linux-release
          path: release
      - name: Install with nothing on the system
        run: |
          if command -v node; then echo "node is already here"; exit 1; fi
          curl -fsSL "$RAW/install.sh" | BLUEPRINT_RELEASE="file://$PWD/$(ls release/*.tar.gz)" sh
      - name: Check
        run: |
          export PATH="$HOME/.blueprint/node/bin:$PATH"
          sh .github/scripts/check-install.sh
          sh .github/scripts/check-install.sh --private-node
