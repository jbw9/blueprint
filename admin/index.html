<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blueprint admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Zilla+Slab:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* The landing page's sheet (landing/components/landing.module.css): one ink, cobalt, on white paper
   lying on a blueprint desk. Always light. */
:root {
  --desk: #1a2fa0;
  --desk-line: rgba(255, 255, 255, 0.1);
  --paper: #fcfdff;
  --low: #eef1fd;
  --ink: #2438c8;
  --muted: #4a5bd2;
  --faint: #8995e2;
  --line: rgba(36, 56, 200, 0.18);
  --strong: rgba(36, 56, 200, 0.5);
  --on-ink: #fcfdff;
  --blush: #f4a3b4;
  --code-bg: #2438c8;
  --code-ink: #d5dbff;
  --display: "Zilla Slab", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --gutter: clamp(16px, 3.4vw, 44px);
  --edge: clamp(8px, 1.6vw, 22px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  padding: var(--edge);
  background-color: var(--desk);
  background-image: linear-gradient(var(--desk-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--desk-line) 1px, transparent 1px);
  background-size: 64px 64px;
  color: var(--ink);
  font: 14px/1.5 var(--body);
}
::selection { background: var(--ink); color: var(--on-ink); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.paper { min-height: calc(100vh - 2 * var(--edge)); border-radius: 6px; background: var(--paper); overflow: clip; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 var(--gutter) var(--gutter); }

/* the bar across the top */
.nav { position: sticky; top: 0; z-index: 5; padding: 0 var(--gutter); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); }
.navBar { display: flex; align-items: center; gap: 16px; max-width: calc(1480px - 2 * var(--gutter)); height: 56px; margin: 0 auto; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 10px; font: 500 15px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.mark svg { width: 42px; height: 30px; fill: currentColor; }
.mark .blush { fill: var(--blush); }
.mark small { font: 11.5px var(--mono); padding: 2px 7px; border: 1px solid var(--strong); }
.navBar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.stamp { font: 11px var(--mono); text-transform: uppercase; color: var(--muted); }

/* labels and buttons */
.eyebrow { margin: 0 0 14px; font: 12px/1.4 var(--mono); text-transform: uppercase; }
.eyebrow::before { content: "[ "; }
.eyebrow::after { content: " ]"; }
h1 { margin: 0; font: 300 clamp(40px, 5vw, 76px)/1 var(--display); letter-spacing: -0.02em; }
h2 { margin: 0 0 4px; font: 300 clamp(26px, 2.6vw, 38px)/1.05 var(--display); letter-spacing: -0.015em; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border: 1px solid var(--ink); background: var(--paper); font: 500 12px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out; }
.btn:hover { background: var(--low); }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--paper)); }
.btn.big { height: 44px; padding: 0 18px; font-size: 13px; }

/* sign in */
.gate { display: grid; place-items: center; min-height: calc(100vh - 2 * var(--edge) - 56px); padding: var(--gutter); }
.gate form { width: min(100%, 420px); padding: 22px; border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.gate h1 { font-size: 52px; margin-bottom: 18px; }
.gate label { display: block; font: 11px var(--mono); text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.gate input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--strong); background: var(--paper); font: 14px var(--mono); }
.gate input:focus { outline: none; border-color: var(--ink); }
.gate .row { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
.gate .err { font: 12px var(--mono); text-transform: uppercase; color: var(--ink); }

/* the sheet's sections */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 36px 0 26px; }
section { margin-top: 44px; }
#runs { scroll-margin-top: 72px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--ink); }
.tile { padding: 10px 14px 14px; border-left: 1px solid var(--ink); border-top: 1px solid var(--ink); margin: -1px 0 0 -1px; min-width: 0; }
.tile dt { font: 10.5px var(--mono); text-transform: uppercase; color: var(--muted); }
.tile dd { margin: 6px 0 0; font: 300 40px/1 var(--display); letter-spacing: -0.02em; }
.tile small { display: block; margin-top: 6px; font: 11px var(--mono); text-transform: uppercase; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
.card { border: 1px solid var(--strong); padding: 12px 14px 14px; min-width: 0; }
.card h3 { margin: 0 0 10px; font: 11.5px var(--mono); letter-spacing: 0.03em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.card h3 span { color: var(--muted); }
h3.sub { margin: 26px 0 10px; font: 11.5px var(--mono); letter-spacing: 0.03em; text-transform: uppercase; }

/* bar charts, as boxes on the grid */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 140px; padding-top: 4px; border-bottom: 1px solid var(--ink);
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 35px; background-position: 0 -1px; }
.bar { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; height: 100%; }
.bar i { display: block; background: var(--ink); }
.bar i.b { background: var(--blush); }
.bar:hover i { background: var(--muted); }
.bar:hover i.b { background: #e98aa0; }
.axis { display: flex; justify-content: space-between; margin-top: 4px; font: 10px var(--mono); text-transform: uppercase; color: var(--muted); }
.key { display: flex; gap: 12px; font: 10.5px var(--mono); text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.key i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--ink); vertical-align: -1px; }
.key i.b { background: var(--blush); }

/* tables */
.scroll { overflow-x: auto; border: 1px solid var(--ink); }
table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
th { text-align: left; font: 500 10.5px var(--mono); text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--ink); white-space: nowrap; background: var(--paper); }
td { padding: 7px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.run { cursor: pointer; }
tbody tr.run:hover td { background: var(--low); }
tbody tr.open td { background: var(--low); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--strong); font-size: 10.5px; text-transform: uppercase; }
.tag.bad { background: var(--blush); border-color: var(--blush); color: var(--ink); }
.tag.ok { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
td.detail { padding: 0; white-space: normal; }
.detailIn { padding: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; background: var(--paper); }
.detailIn h4 { margin: 0 0 6px; font: 500 10.5px var(--mono); text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font: 12px var(--mono); }
.kv span:nth-child(odd) { color: var(--muted); }
.wide { grid-column: 1 / -1; }
pre.log { margin: 0; max-height: 420px; overflow: auto; padding: 12px 14px; background: var(--code-bg); color: var(--code-ink); font: 11.5px/1.55 var(--mono); white-space: pre; }
ul.problems { margin: 0; padding-left: 16px; font: 11.5px/1.5 var(--mono); }
.list { display: grid; gap: 4px; font: 12px var(--mono); }
.list div { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; position: relative; padding: 2px 6px; }
.list div b { position: absolute; inset: 0 auto 0 0; background: var(--low); z-index: 0; }
.list div span { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { font: 12px var(--mono); text-transform: uppercase; color: var(--faint); padding: 10px 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
button.repo { padding: 0; border: 0; background: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--strong); }
button.repo:hover { text-decoration-color: var(--ink); }
.repoHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 14px; }
.repoHead h3 { margin: 0; font: 300 30px/1 var(--display); }
.better { background: var(--ink); color: var(--on-ink); padding: 0 4px; }
.worse { background: var(--blush); padding: 0 4px; }
.delta { font-size: 10.5px; margin-left: 6px; }
td.msg { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
select.status { height: 24px; padding: 0 4px; border: 1px solid var(--strong); background: var(--paper); font: 11px var(--mono); text-transform: uppercase; color: var(--ink); cursor: pointer; }
.fbText { margin: 0; font: 13px/1.55 var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
.shots { display: flex; flex-wrap: wrap; gap: 10px; }
.shots a { display: block; border: 1px solid var(--strong); }
.shots img { display: block; max-width: min(520px, 80vw); max-height: 320px; }

/* the drawing's title block */
.end { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; margin-top: 64px; border: 1px solid var(--ink); }
.end > div { min-width: 0; padding: 8px 12px 10px; border-left: 1px solid var(--ink); }
.end > div:first-child { border-left: 0; }
.end dt { font: 10px var(--mono); text-transform: uppercase; color: var(--muted); }
.end dd { margin: 4px 0 0; font: 12.5px var(--mono); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.end .title dd { font: 400 26px/1 var(--display); }
@media (max-width: 760px) {
  .end { grid-template-columns: 1fr 1fr; }
  .end > div:nth-child(3) { border-left: 0; }
  .end > div:nth-child(n+3) { border-top: 1px solid var(--ink); }
  .stamp { display: none; }
}
</style>
</head>
<body>
<div class="paper">
  <header class="nav">
    <div class="navBar">
      <span class="mark">
        <svg viewBox="140 320 744 530" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M334 562C332 446 414 346 514 346C612 346 694 444 690 560"/>
            <path d="M200 562c0-56 48-56 48 0c0-56 48-56 48 0M728 562c0-56 48-56 48 0c0-56 48-56 48 0"/>
            <path d="M160 566C360 558 660 570 864 562"/>
            <path d="M268 656H532M580 656H664M332 740H716M332 824H464M512 824H588"/>
          </g>
          <ellipse cx="460" cy="474" rx="16" ry="24"/><ellipse cx="570" cy="474" rx="16" ry="24"/>
          <g class="blush"><ellipse cx="412" cy="524" rx="29" ry="16"/><ellipse cx="620" cy="524" rx="29" ry="16"/></g>
        </svg>
        Blueprint <small>Admin</small>
      </span>
      <div class="right" id="bar"></div>
    </div>
  </header>
  <main id="app"></main>
</div>
<script>
(function () {
  // The dashboard's backend (app/scripts/api/admin.mjs): every read checks the password.
  var API_URL = "https://rn24aj5jclm6ioyeqrlsxbztky0bfwgc.lambda-url.us-east-1.on.aws";
  var PW = "bp-admin-pw";

  var app = document.getElementById("app");
  var bar = document.getElementById("bar");
  var data = null;
  var openRun = null;
  var openUpdate = null;
  var repoView = null;
  var runFilter = "all";
  var details = {};
  var openFb = null;
  var fbFilter = "open";
  var fbImages = {};
  var FB_STATUS = ["pending", "in progress", "resolved", "closed"];

  function stored() { try { localStorage.removeItem(PW); return sessionStorage.getItem(PW) || ""; } catch (e) { return ""; } }
  function keep(v) { try { v ? sessionStorage.setItem(PW, v) : sessionStorage.removeItem(PW); } catch (e) {} }

  function rpc(fn, body) {
    return fetch(API_URL + "/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j && j.message || r.statusText);
        return j;
      });
    });
  }

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var n = function (x) { return x == null ? "—" : Number(x).toLocaleString("en-US"); };
  var usd = function (x) { return x == null ? "—" : "$" + Number(x).toFixed(2); };
  var big = function (x) {
    if (x == null) return "—";
    x = Number(x);
    return x >= 1e9 ? (x / 1e9).toFixed(2) + "B" : x >= 1e6 ? (x / 1e6).toFixed(1) + "M" : x >= 1e4 ? Math.round(x / 1e3) + "k" : n(x);
  };
  var secs = function (x) {
    if (x == null) return "—";
    x = Math.round(Number(x));
    return x < 60 ? x + "s" : Math.floor(x / 60) + "m " + String(x % 60).padStart(2, "0") + "s";
  };
  var pct = function (a, b) { return b ? Math.round(100 * a / b) + "%" : "—"; };
  var when = function (iso) {
    var d = new Date(iso), s = (Date.now() - d) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  };
  var ver = function (v) { return v == null ? "unversioned" : "v" + v; };

  function gate(msg) {
    bar.innerHTML = "";
    app.innerHTML =
      '<div class="gate"><form id="gate">' +
      '<p class="eyebrow">Internal</p><h1>Admin</h1>' +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus>' +
      '<div class="row"><button class="btn primary big" type="submit">Open</button>' +
      (msg ? '<span class="err">' + esc(msg) + "</span>" : "") + "</div></form></div>";
    document.getElementById("gate").addEventListener("submit", function (e) {
      e.preventDefault();
      load(document.getElementById("pw").value);
    });
  }

  function load(pw) {
    bar.innerHTML = '<span class="stamp">Loading…</span>';
    Promise.all([rpc("bp_admin_overview", { pw: pw }), rpc("bp_admin_credit", { pw: pw }), rpc("bp_admin_feedback", { pw: pw })]).then(function (both) {
      var d = both[0];
      d.credit = both[1];
      d.feedback = both[2] || [];
      keep(pw);
      data = d;
      details = {};
      render();
    }, function (e) {
      keep("");
      gate(/not allowed/i.test(e.message) ? "Wrong password" : e.message);
    });
  }

  function bars(rows, a, b) {
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return (r[a] || 0) + (b ? r[b] || 0 : 0); })));
    return '<div class="bars">' + rows.map(function (r) {
      var day = new Date(r.day + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
      var tip = day + ": " + (r[a] || 0) + (b ? " / " + (r[b] || 0) : "");
      return '<div class="bar" title="' + esc(tip) + '"><i style="height:' + (100 * (r[a] || 0) / max) + '%"></i>' +
        (b ? '<i class="b" style="height:' + (100 * (r[b] || 0) / max) + '%"></i>' : "") + "</div>";
    }).join("") + '</div><div class="axis"><span>30 days ago</span><span>Today</span></div>';
  }

  function list(rows, label, value) {
    if (!rows.length) return '<p class="empty">Nothing yet</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return r[value]; }));
    return '<div class="list">' + rows.map(function (r) {
      return '<div><b style="width:' + (100 * r[value] / max) + '%"></b><span>' + esc(r[label]) + "</span><span>" + n(r[value]) + "</span></div>";
    }).join("") + "</div>";
  }

  // Each step's people over 30 days; a step can outgrow the one before (an install without a visit to blpr.dev).
  function funnel(d) {
    var signups = d.credit ? d.credit.daily.reduce(function (a, x) { return a + (x.signups || 0); }, 0) : null;
    return [
      { step: "Visited blpr.dev", n: d.visitors_30 },
      { step: "Copied the install", n: d.copied_30 },
      { step: "Installed", n: d.installs_30 },
      { step: "Signed in to credit", n: signups },
      { step: "Made a blueprint", n: d.machines_30 }
    ].filter(function (r) { return r.n != null; });
  }

  function tile(label, value, sub) {
    return '<div class="tile"><dt>' + label + "</dt><dd>" + value + "</dd>" + (sub ? "<small>" + sub + "</small>" : "") + "</div>";
  }

  function tokens(bill) {
    var keys = Object.keys(bill || {});
    if (!keys.length) return null;
    return keys.reduce(function (t, k) {
      var b = bill[k];
      ["calls", "cached", "input", "output", "cacheRead"].forEach(function (f) { t[f] += Number(b[f] || 0); });
      return t;
    }, { calls: 0, cached: 0, input: 0, output: 0, cacheRead: 0 });
  }

  function billTable(bill) {
    var keys = Object.keys(bill || {});
    if (!keys.length) return "";
    var t = tokens(bill), cost = keys.reduce(function (a, k) { return a + Number(bill[k].usd || 0); }, 0);
    var row = function (name, b, c) {
      return "<tr><td>" + name + '</td><td class="num">' + n(b.calls) + '</td><td class="num">' + n(b.input) + '</td><td class="num">' + n(b.output) +
        '</td><td class="num">' + n(b.cacheRead) + '</td><td class="num">' + usd(c) + "</td></tr>";
    };
    return '<div class="scroll"><table><thead><tr><th>Stage</th><th class="num">Calls</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache read</th><th class="num">USD</th></tr></thead><tbody>' +
      keys.map(function (k) { return row(esc(k), bill[k], bill[k].usd); }).join("") + row("<b>Total</b>", t, cost) + "</tbody></table></div>";
  }

  // The updates this blueprint went on to get, newest first; one opens to its files, sections, tokens and (when it failed) its log.
  function updatesTable(list) {
    if (!list.length) return '<p class="empty">Not updated since</p>';
    return '<div class="scroll"><table><thead><tr><th>When</th><th>Status</th><th>Version</th><th class="num">Files changed</th><th class="num">Sections redone</th><th class="num">Tokens</th><th class="num">Time</th><th class="num">Cost</th></tr></thead><tbody>' +
      list.map(function (u) {
        var rep = u.report || {}, t = tokens(rep.bill), open = openUpdate === u.id;
        var changed = rep.changed || [], sections = rep.sections || [];
        return '<tr class="run' + (open ? " open" : "") + '" data-update="' + u.id + '">' +
          '<td title="' + esc(new Date(u.at).toLocaleString()) + '">' + when(u.at) + "</td>" +
          '<td><span class="tag ' + (u.status === "ok" ? "ok" : "bad") + '">' + esc(u.status) + "</span></td>" +
          "<td>" + ver(u.mapper_version) + '</td><td class="num">' + n(changed.length) + '</td><td class="num">' + n(sections.length) +
          '</td><td class="num">' + (t ? n(t.input + t.output + t.cacheRead) : "—") + '</td><td class="num">' + secs(u.total_s) + '</td><td class="num">' + usd(u.usd) + "</td></tr>" +
          (open ? '<tr><td class="detail" colspan="8"><div class="detailIn">' +
            "<div><h4>Files changed</h4>" + (changed.length ? '<ul class="problems">' + changed.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" : '<p class="empty">None</p>') + "</div>" +
            "<div><h4>Sections redone</h4>" + (sections.length ? '<ul class="problems">' + sections.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" : '<p class="empty">None</p>') +
            ((rep.failed || []).length ? "<h4 style=\"margin-top:10px\">Failed</h4><ul class=\"problems\">" + rep.failed.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" : "") + "</div>" +
            (rep.bill ? '<div class="wide"><h4>Tokens and cost by stage</h4>' + billTable(rep.bill) + "</div>" : "") +
            (u.log_tail ? '<div class="wide"><h4>End of the log</h4><pre class="log">' + esc(u.log_tail) + "</pre></div>" : "") +
            "</div></td></tr>" : "");
      }).join("") + "</tbody></table></div>";
  }

  function detail(r) {
    var d = details[r.id];
    if (!d) return '<p class="empty">Loading the report…</p>';
    if (d.error) return '<p class="empty">' + esc(d.error) + "</p>";
    var rep = d.report || {};
    var el = rep.elapsed || {};
    var billRows = billTable(rep.bill);
    var tok = tokens(rep.bill);
    var models = d.models || {};
    var problems = (rep.check && rep.check.problems) || [];
    var quick = (rep.quickCheck && rep.quickCheck.problems) || [];
    var deepened = rep.deepened || [];
    return '<div class="detailIn">' +
      "<div><h4>Time</h4><div class=\"kv\">" + Object.keys(el).map(function (k) { return "<span>" + esc(k) + "</span><span>" + secs(el[k]) + "</span>"; }).join("") + "</div></div>" +
      (tok ? "<div><h4>Tokens</h4><div class=\"kv\"><span>input</span><span>" + n(tok.input) + "</span><span>output</span><span>" + n(tok.output) +
        "</span><span>cache read</span><span>" + n(tok.cacheRead) + "</span><span>total</span><span>" + n(tok.input + tok.output + tok.cacheRead) +
        "</span><span>calls</span><span>" + n(tok.calls) + (tok.cached ? " (" + n(tok.cached) + " replayed)" : "") + "</span></div></div>" : "") +
      "<div><h4>Models</h4><div class=\"kv\">" + Object.keys(models).map(function (k) { return "<span>" + esc(k) + "</span><span>" + esc(String(models[k]).replace(/^global\.anthropic\./, "")) + "</span>"; }).join("") + "</div></div>" +
      (deepened.length ? "<div><h4>Sections</h4><div class=\"kv\">" + deepened.map(function (s) { return "<span>" + esc(s.id) + "</span><span>" + (s.accepted ? "accepted" : "not accepted") + " · " + s.turns + " turns</span>"; }).join("") + "</div></div>" : "") +
      (billRows ? '<div class="wide"><h4>Tokens and cost by stage</h4>' + billRows + "</div>" : "") +
      '<div class="wide"><h4>Updates · ' + d.updates.length + (d.updates.length ? " · " + usd(d.updates.reduce(function (a, u) { return a + Number(u.usd || 0); }, 0)) : "") + "</h4>" + updatesTable(d.updates) + "</div>" +
      (quick.length || problems.length ? '<div class="wide"><h4>Check problems · quick ' + quick.length + " · final " + problems.length + '</h4><ul class="problems">' + problems.concat(problems.length ? [] : quick).slice(0, 30).map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul></div>" : "") +
      '<div class="wide"><h4>End of the log</h4><pre class="log">' + esc(d.log_tail || "(no log)") + "</pre></div>" +
      "</div>";
  }

  function runsTable() {
    if (repoView) return repoPanel();
    var rows = data.recent.filter(function (r) {
      return runFilter === "all" || r.status !== "ok";
    });
    var filters = [["all", "All"], ["failed", "Failed"]].map(function (f) {
      return '<button class="btn" data-filter="' + f[0] + '" aria-pressed="' + (runFilter === f[0]) + '">' + f[1] + "</button>";
    }).join("");
    if (!rows.length) return '<div class="filters">' + filters + '</div><p class="empty">No runs yet</p>';
    return '<div class="filters">' + filters + '</div><div class="scroll"><table><thead><tr>' +
      '<th>When</th><th>Status</th><th>Version</th><th>Repo</th><th>Commit</th><th class="num">Files</th><th class="num">Quick</th><th class="num">Total</th><th class="num">Cost</th><th class="num">Updates</th><th>Backend</th><th>Machine</th>' +
      "</tr></thead><tbody>" + rows.map(function (r) {
        var open = openRun === r.id;
        return '<tr class="run' + (open ? " open" : "") + '" data-run="' + r.id + '">' +
          '<td title="' + esc(new Date(r.at).toLocaleString()) + '">' + when(r.at) + "</td>" +
          '<td><span class="tag ' + (r.status === "ok" ? "ok" : "bad") + '">' + esc(r.status) + "</span></td>" +
          "<td>" + ver(r.mapper_version) + '</td><td><button class="repo" data-repo="' + esc(r.repo) + '" title="Every blueprint of ' + esc(r.repo) + ' across versions">' + esc(r.repo) + "</button></td>" +
          "<td>" + esc((r.repo_commit || "").slice(0, 7)) + '</td><td class="num">' + n(r.files) + '</td><td class="num">' + secs(r.quick_s) +
          '</td><td class="num">' + secs(r.total_s) + '</td><td class="num">' + usd(r.usd) + '</td><td class="num" title="' + usd(r.updates_usd) + ' in updates">' + n(r.updates) + "</td><td>" + esc(r.backend) +
          "</td><td>" + esc((r.install_id || "").slice(0, 8)) + "</td></tr>" +
          (open ? '<tr><td class="detail" colspan="12">' + detail(r) + "</td></tr>" : "");
      }).join("") + "</tbody></table></div>";
  }

  function render() {

    app.innerHTML = '<div class="wrap">' +
      '<div class="head"><div><p class="eyebrow">Internal · last 30 days</p><h1>How Blueprint is doing</h1>' +
      '<p class="lede">Installs from install.sh, visits to blpr.dev, and every blueprint run reported by the app, by generator version.</p></div></div>' +

      '<dl class="tiles">' +

      tile("Copied install", n(d.copied_30), pct(d.copied_30, d.visitors_30) + " of visitors") +
      tile("New blueprints", n(d.runs_30), pct(d.runs_failed_30, d.runs_30) + " failed · " + n(d.updates_30) + " updates") +
      tile("Machines", n(d.machines), "that sent a run") +
      tile("Model spend", usd(d.usd_30), "at API list price") +
      tile("Mapper", latest ? ver(latest.mapper_version) : "—", latest ? "median " + secs(latest.total_s) + " · " + usd(latest.usd) : "no runs yet") +
      "</dl>" +

      '<section><div class="grid3">' +
      '<div class="card"><h3>Installs per day <span>' + n(d.installs_30) + '</span></h3>' + bars(d.daily, "installs", "installs_failed") +
      '<div class="key"><span><i></i>Worked</span><span><i class="b"></i>Failed</span></div></div>' +
      '<div class="card"><h3>Visitors per day <span>' + n(d.visitors_30) + "</span></h3>" + bars(d.daily, "visitors", "copied") +
      '<div class="key"><span><i></i>Visited</span><span><i class="b"></i>Copied install</span></div></div>' +
      '<div class="card"><h3>New blueprints per day <span>' + n(d.runs_30) + "</span></h3>" + bars(d.daily, "runs_ok", "runs_failed") +
      '<div class="key"><span><i></i>Finished</span><span><i class="b"></i>Failed</span></div></div>' +
      "</div></section>" +

      '<section><p class="eyebrow">Traffic</p><h2>Where people come from</h2><p class="lede">Each visitor counts once a day, by where that day began: a tagged link (<code>?utm_source=</code>, <code>?ref=</code>) names its source, otherwise the site they came from.</p>' +
      '<div class="grid3" style="margin-top:14px">' +
      '<div class="card"><h3>Sources</h3>' + list(d.referrers, "referrer", "visitors") + "</div>" +
      '<div class="card"><h3>Campaigns <span>source / medium / campaign</span></h3>' + list(d.campaigns || [], "campaign", "visitors") + "</div>" +
      '<div class="card"><h3>Funnel <span>30 days</span></h3>' + list(funnel(d), "step", "n") + "</div>" +
      '<div class="card"><h3>First page</h3>' + list(d.pages || [], "page", "visitors") + "</div>" +
      '<div class="card"><h3>Countries</h3>' + list(d.countries, "country", "visitors") + "</div>" +
      '<div class="card"><h3>Installs by system</h3>' + list(d.os, "os", "installs") + "</div>" +
      '<div class="card"><h3>App versions <span>machines, by their last run</span></h3>' + list(d.apps || [], "version", "machines") + "</div>" +
      "</div></section>" +

      '<section><p class="eyebrow">Generator</p><h2>By version</h2><p class="lede">Full blueprint runs only, not updates. Times and cost are medians and averages of runs that finished.</p>' +
      '<div class="scroll" style="margin-top:14px"><table><thead><tr><th>Version</th><th class="num">Runs</th><th class="num">Failed</th><th class="num">Quick blueprint</th><th class="num">Full blueprint</th><th class="num">Avg cost</th><th class="num">Avg files</th><th class="num">Check problems</th><th>First run</th><th>Last run</th></tr></thead><tbody>' +
      (d.versions.length ? d.versions.map(function (v) {

          '</td><td class="num">' + (v.files == null ? "—" : Math.round(v.files)) + '</td><td class="num">' + (v.problems == null ? "—" : Number(v.problems).toFixed(1)) +
          "</td><td>" + new Date(v.first_at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) + "</td><td>" + when(v.last_at) + "</td></tr>";
      }).join("") : '<tr><td colspan="10" class="empty">No runs yet</td></tr>') +
      "</tbody></table></div></section>" +

      '<section><p class="eyebrow">Runs</p><h2>Recent blueprints</h2><p class="lede">The latest 200 new blueprints. Click one for its time by stage, tokens, models, cost, the end of its log, and every update it got after.</p><div style="margin-top:14px" id="runs">' + runsTable() + "</div></section>" +

      '<section><p class="eyebrow">Feedback</p><h2>Bugs and feedback</h2><p class="lede">Sent from the app\'s Feedback dialog and the contact form on blpr.dev. Each sender sees the status you set here: in the app beside what they sent.</p><div style="margin-top:14px" id="feedback">' + feedbackTable() + "</div></section>" +

      creditSection(d.credit) +

      '<dl class="end"><div class="title"><dt>Title</dt><dd>Blueprint admin</dd></div><div><dt>Drawn</dt><dd>' +
      new Date().toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) + '</dd></div><div><dt>Sheet</dt><dd>1 of 1</dd></div><div><dt>Site</dt><dd><a href="https://blpr.dev">blpr.dev</a></dd></div></dl>' +
      "</div>";
  }

  // Blueprint credit (app/scripts/api/credit.mjs): what it costs, and who uses it. Its settings are changed in the DynamoDB console.
  function creditSection(c) {
    if (!c) return "";
    var cfg = c.config || {};
    var models = c.models || [];
    var WHY = { tab5h: "5-hour session used up", tabweek: "week used up", genweek: "maps week used up", minute: "spending fast this minute", slots: "too many at once", month: "monthly ceiling reached", closed: "credit not open to the account" };
    var refused = (c.refused || []).map(function (r) {
      var k = String(r.kind).split(" · ");
      return { kind: (k[0] === "tab" ? "Claude Code" : k[0] === "gen" ? "Maps" : k[0]) + " · " + (WHY[k[1]] || k[1] || ""), n: r.n };
    });
    var spend = c.daily.reduce(function (a, d) { return a + Number(d.tab_usd || 0) + Number(d.gen_usd || 0); }, 0);
    var days = [];
    for (var i = 29; i >= 0; i--) days.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
    var byDay = {};
    c.daily.forEach(function (d) { byDay[d.day] = d; });
    var rows = days.map(function (day) {
      var d = byDay[day] || {};
      return { day: day, tab: Math.round(100 * Number(d.tab_usd || 0)), gen: Math.round(100 * Number(d.gen_usd || 0)), tab_tokens: d.tab_tokens || 0, gen_tokens: d.gen_tokens || 0, active: d.active || 0, signups: d.signups || 0 };
    });
    var sum = function (k) { return models.reduce(function (a, m) { return a + Number(m[k] || 0); }, 0); };
    var tokens = sum("in_tok") + sum("out_tok") + sum("cr_tok") + sum("cw_tok");
    var signups = rows.reduce(function (a, r) { return a + r.signups; }, 0);
    var left = cfg.ends_at ? Math.ceil((Date.parse(cfg.ends_at) - Date.now()) / 86400000) : null;
    var life = c.life || { tab_usd: 0, gen_usd: 0, tab_tokens: 0, gen_tokens: 0, calls: 0, tab_calls: 0, gen_calls: 0 };
    var policy = esc(cfg.policy || "log") + (cfg.gen_policy && cfg.gen_policy !== cfg.policy ? ", maps " + esc(cfg.gen_policy) : "");

    return '<section><p class="eyebrow">Blueprint credit</p><h2>Claude on Blueprint\'s Bedrock</h2><p class="lede">' +
      (cfg.enabled ? "Open to every GitHub account" + (cfg.ends_at ? " until " + esc(String(cfg.ends_at).slice(0, 10)) : "") + ". " : "Off for everyone but accounts marked allowed. ") +
      "Claude Code " + usd(cfg.tab_usd_5h) + " per " + n(cfg.window_hours) + " hours and " + usd(cfg.tab_usd_week) + " a week; maps " + (cfg.gen_usd_week == null ? "without a cap" : usd(cfg.gen_usd_week) + " a week, fair use") +
      "; " + n(cfg.tab_inflight) + " calls at once; at most " + usd(cfg.monthly_usd_ceiling) + " a month for everyone. Shape policy: " + policy +
      ". Cost is at list price, as the credit charges it. Change the settings on the <code>credit / config</code> item in the bluprint table; block or let in an account on its <code>account / gh:&lt;id&gt;</code> item.</p>" +

      '<h3 class="sub">Lifetime' + (life.since ? " · since " + esc(new Date(life.since).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })) : "") + "</h3>" +
      '<dl class="tiles">' +
      tile("Tokens processed", big(life.tab_tokens + life.gen_tokens), n(life.calls) + " calls") +
      tile("Total cost", usd(life.tab_usd + life.gen_usd), "at list price") +
      tile("Claude Code", usd(life.tab_usd), big(life.tab_tokens) + " tokens · " + n(life.tab_calls) + " calls") +
      tile("Map generation", usd(life.gen_usd), big(life.gen_tokens) + " tokens · " + n(life.gen_calls) + " calls") +
      tile("Blueprints made", n(c.maps_all), n(c.maps_failed_all) + " failed · " + n(c.updates_all) + " updates") +
      tile("Accounts", n(c.accounts_all), n(c.active_7) + " active in 7 days · " + n(signups) + " new in 30") +
      "</dl>" +
      '<h3 class="sub">Now</h3>' +
      '<dl class="tiles">' +
      tile("This month", usd(c.usd_month), pct(c.usd_month, cfg.monthly_usd_ceiling) + " of the " + usd(cfg.monthly_usd_ceiling) + " ceiling") +
      tile("Last 30 days", usd(spend), big(tokens) + " tokens") +
      tile("Active today", n(rows[29].active), "accounts that made a call") +
      tile("Turned away", n(refused.reduce(function (a, r) { return a + r.n; }, 0)), "calls in 30 days") +
      tile("Promotion", left == null ? "—" : left > 0 ? left + "d" : "over", cfg.ends_at ? "ends " + esc(String(cfg.ends_at).slice(0, 10)) : "no end set") +
      "</dl>" +

      '<div class="grid3" style="margin-top:18px">' +
      '<div class="card"><h3>Spend per day, in cents <span>' + usd(spend) + "</span></h3>" + bars(rows, "tab", "gen") +
      '<div class="key"><span><i></i>Claude Code</span><span><i class="b"></i>Maps</span></div></div>' +
      '<div class="card"><h3>Tokens per day <span>' + big(tokens) + "</span></h3>" + bars(rows, "tab_tokens", "gen_tokens") +
      '<div class="key"><span><i></i>Claude Code</span><span><i class="b"></i>Maps</span></div></div>' +
      '<div class="card"><h3>Accounts per day <span>' + n(signups) + " new</span></h3>" + bars(rows, "active", "signups") +
      '<div class="key"><span><i></i>Active</span><span><i class="b"></i>New</span></div></div>' +
      "</div>" +

      '<h3 class="sub">By model, 30 days</h3>' +
      '<div class="scroll"><table><thead><tr><th>Used by</th><th>Model</th><th class="num">Calls</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache read</th><th class="num">Cache write</th><th class="num">Of it 1h</th><th class="num">Failed</th><th class="num">Throttled</th><th class="num">Out of shape</th><th class="num">Cost</th><th class="num">Per call</th></tr></thead><tbody>' +
      (models.length ? models.map(function (m) {
        return "<tr><td>" + (m.lane === "tab" ? "Claude Code" : m.lane === "gen" ? "Maps" : esc(m.lane)) + "</td><td>" + esc(m.family) + '</td><td class="num">' + n(m.calls) +
          '</td><td class="num">' + big(m.in_tok) + '</td><td class="num">' + big(m.out_tok) + '</td><td class="num">' + big(m.cr_tok) + '</td><td class="num">' + big(m.cw_tok) +
          '</td><td class="num">' + big(m.cw1h_tok) + '</td><td class="num">' + pct(m.failed, m.calls) + '</td><td class="num">' + n(m.throttled) + '</td><td class="num">' + n(m.flagged) +
          '</td><td class="num">' + usd(m.usd) + '</td><td class="num">' + (m.calls ? "$" + (m.usd / m.calls).toFixed(3) : "—") + "</td></tr>";
      }).join("") + "<tr><td><b>Total</b></td><td></td><td class=\"num\">" + n(sum("calls")) + '</td><td class="num">' + big(sum("in_tok")) + '</td><td class="num">' + big(sum("out_tok")) +
        '</td><td class="num">' + big(sum("cr_tok")) + '</td><td class="num">' + big(sum("cw_tok")) + '</td><td class="num">' + big(sum("cw1h_tok")) + '</td><td class="num">' + pct(sum("failed"), sum("calls")) +
        '</td><td class="num">' + n(sum("throttled")) + '</td><td class="num">' + n(sum("flagged")) + '</td><td class="num">' + usd(sum("usd")) + '</td><td class="num"></td></tr>'
        : '<tr><td colspan="13" class="empty">No calls yet</td></tr>') +
      "</tbody></table></div>" +

      '<div class="grid3" style="margin-top:18px"><div class="card"><h3>Turned away, by why <span>30 days</span></h3>' + list(refused, "kind", "n") + "</div></div>" +

      '<h3 class="sub">Accounts · lifetime</h3>' +
      '<p class="lede" style="margin:-4px 0 10px">Cost and tokens are lifetime, at list price. Blueprints count those made on a machine signed in to the account, on Blueprint credit or the person\'s own Claude Code. This week is the share of each allowance used now: Claude Code\'s 5-hour session, its week, and maps\' week.</p>' +
      '<div class="scroll"><table><thead><tr><th>GitHub</th><th>Joined</th><th>Access</th><th class="num">Machines</th><th class="num">Claude Code</th><th class="num">Maps</th><th class="num">Total</th><th class="num">Tokens</th><th class="num">Calls</th><th class="num">Blueprints</th><th class="num">Updates</th><th class="num">Failed</th><th class="num">Repos</th><th>This week</th><th class="num">Days active</th><th class="num">Out of shape</th><th>Last used</th><th>Note</th></tr></thead><tbody>' +
      (c.accounts.length ? c.accounts.map(function (a) {
        var access = a.blocked ? "blocked" : a.uncapped ? "uncapped" : a.allowed ? "allowed" : cfg.enabled ? "open" : "waiting";
        var l = a.life || {};
        var m = a.meters || {};
        var share = function (k) { var x = m[k]; return x && x.limit ? Math.min(100, Math.round(100 * x.used / x.limit)) + "%" : "—"; };
        var repos = a.repos || [];
        return '<tr><td title="' + esc(a.account) + '"><a href="https://github.com/' + esc(a.login || "") + '">' + esc(a.login || a.account) + "</a></td><td title=\"GitHub account since " +
          (a.gh_created ? esc(String(a.gh_created).slice(0, 10)) : "—") + '">' + (a.first_at ? esc(new Date(a.first_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })) : "—") + "</td><td>" + access +
          '</td><td class="num">' + n(a.machines) + '</td><td class="num">' + usd(l.tab_usd) + '</td><td class="num">' + usd(l.gen_usd) + '</td><td class="num"><b>' + usd((l.tab_usd || 0) + (l.gen_usd || 0)) +
          '</b></td><td class="num">' + big((l.tab_tokens || 0) + (l.gen_tokens || 0)) + '</td><td class="num">' + n(l.calls) + '</td><td class="num">' + n(a.maps) + '</td><td class="num">' + n(a.updates) +
          '</td><td class="num">' + n(a.maps_failed) + '</td><td class="num" title="' + esc(repos.join("\n")) + '">' + n(repos.length) +
          "</td><td>S " + share("tab5h") + " · W " + share("tabweek") + " · M " + share("genweek") +
          '</td><td class="num" title="of the last 30">' + n(a.active_days_30) + '</td><td class="num">' + n(a.flagged_30) + "</td><td>" + (a.last_at ? when(a.last_at) : "—") + "</td><td>" + esc(a.note || "") + "</td></tr>";
      }).join("") : '<tr><td colspan="18" class="empty">No accounts yet</td></tr>') +
      "</tbody></table></div></section>";
  }

  var median = function (xs) {
    xs = xs.filter(function (x) { return x != null; }).map(Number).sort(function (a, b) { return a - b; });
    if (!xs.length) return null;
    var m = xs.length >> 1;
    return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
  };
  var mean = function (xs) {
    xs = xs.filter(function (x) { return x != null; }).map(Number);
    return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : null;
  };
  // Lower is better for everything compared here.
  function delta(now, before) {
    if (now == null || before == null || !before) return "";
    var p = Math.round(100 * (now - before) / before);
    if (!p) return '<span class="delta">±0%</span>';
    return '<span class="delta ' + (p < 0 ? "better" : "worse") + '">' + (p > 0 ? "+" : "") + p + "%</span>";
  }

  // Per-run bars for one measure, shaded by generator version so a change of version shows as a change of shade.
  function runBars(runs, key, fmt, versions) {
    var ok = runs.filter(function (r) { return r.status === "ok" && r[key] != null; });
    if (!ok.length) return '<p class="empty">No finished runs</p>';
    var max = Math.max.apply(null, ok.map(function (r) { return Number(r[key]); })) || 1;
    return '<div class="bars">' + ok.map(function (r) {
      var shade = 0.35 + 0.65 * (versions.indexOf(r.mapper_version) + 1) / versions.length;
      return '<div class="bar" title="' + esc(ver(r.mapper_version) + " · " + new Date(r.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " · " + fmt(r[key])) +
        '"><i style="height:' + (100 * Number(r[key]) / max) + "%;opacity:" + shade + '"></i></div>';
    }).join("") + '</div><div class="axis"><span>First blueprint</span><span>Latest</span></div>';
  }

  function repoPanel() {
    var v = repoView;
    var head = '<div class="repoHead"><button class="btn" id="back">← All blueprints</button><h3>' + esc(v.name) + "</h3>" +
      '<span class="stamp">Every new blueprint of this repo, on every machine</span></div>';
    if (!v.runs) return head + '<p class="empty">' + esc(v.error || "Loading…") + "</p>";
    var runs = v.runs;
    var versions = [];
    runs.forEach(function (r) { if (versions.indexOf(r.mapper_version) < 0) versions.push(r.mapper_version); });
    versions.sort(function (a, b) { return (a == null ? -1 : a) - (b == null ? -1 : b); });
    var prev = null;
    var byVersion = versions.map(function (ver_) {
      var rs = runs.filter(function (r) { return r.mapper_version === ver_; });
      var ok = rs.filter(function (r) { return r.status === "ok"; });
      var row = {
        version: ver_, runs: rs.length, failed: rs.length - ok.length,
        total_s: median(ok.map(function (r) { return r.total_s; })),
        quick_s: median(ok.map(function (r) { return r.quick_s; })),
        usd: mean(ok.map(function (r) { return r.usd; })),
        tokens: mean(ok.map(function (r) { return r.tokens; })),
        problems: mean(ok.map(function (r) { return r.problems; })),
        quick_problems: mean(ok.map(function (r) { return r.quick_problems; })),
        accepted: mean(ok.map(function (r) { return r.sections ? r.accepted / r.sections : null; }))
      };
      row.prev = prev;
      prev = row;
      return row;
    }).reverse();
    var cell = function (row, key, fmt) {
      return '<td class="num">' + (row[key] == null ? "—" : fmt(row[key])) + (row.prev ? delta(row[key], row.prev[key]) : "") + "</td>";
    };
    var one = function (x) { return Number(x).toFixed(1); };
    var tok = function (x) { return n(Math.round(x)); };
    return head +
      '<div class="scroll"><table><thead><tr><th>Version</th><th class="num">Blueprints</th><th class="num">Failed</th><th class="num">Quick blueprint</th><th class="num">Full blueprint</th><th class="num">Avg cost</th><th class="num">Avg tokens</th><th class="num">Quick-blueprint problems</th><th class="num">Final problems</th><th class="num">Sections accepted</th></tr></thead><tbody>' +
      byVersion.map(function (row) {
        return "<tr><td>" + ver(row.version) + '</td><td class="num">' + n(row.runs) + '</td><td class="num">' + pct(row.failed, row.runs) + "</td>" +
          cell(row, "quick_s", secs) + cell(row, "total_s", secs) + cell(row, "usd", usd) + cell(row, "tokens", tok) +
          cell(row, "quick_problems", one) + cell(row, "problems", one) +
          '<td class="num">' + (row.accepted == null ? "—" : Math.round(100 * row.accepted) + "%") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="lede" style="margin-top:8px">Medians for time, averages for the rest, of blueprints that finished. Each change is against the version before; lower is better.</p>' +
      '<div class="grid3" style="margin-top:18px">' +
      '<div class="card"><h3>Full blueprint time</h3>' + runBars(runs, "total_s", secs, versions) + "</div>" +
      '<div class="card"><h3>Cost</h3>' + runBars(runs, "usd", usd, versions) + "</div>" +
      '<div class="card"><h3>Quick-blueprint problems</h3>' + runBars(runs, "quick_problems", n, versions) + "</div>" +
      "</div>" +
      '<p class="lede" style="margin-top:6px">One bar per blueprint, oldest first; darker is a newer version.</p>' +
      '<div class="scroll" style="margin-top:18px"><table><thead><tr><th>When</th><th>Status</th><th>Version</th><th>Commit</th><th class="num">Files</th><th class="num">Quick</th><th class="num">Total</th><th class="num">Cost</th><th class="num">Tokens</th><th class="num">Problems</th><th class="num">Updates</th><th>Machine</th></tr></thead><tbody>' +
      runs.slice().reverse().map(function (r) {
        var open = openRun === r.id;
        return '<tr class="run' + (open ? " open" : "") + '" data-run="' + r.id + '">' +
          '<td title="' + esc(new Date(r.at).toLocaleString()) + '">' + when(r.at) + "</td>" +
          '<td><span class="tag ' + (r.status === "ok" ? "ok" : "bad") + '">' + esc(r.status) + "</span></td>" +
          "<td>" + ver(r.mapper_version) + "</td><td>" + esc((r.repo_commit || "").slice(0, 7)) + '</td><td class="num">' + n(r.files) +
          '</td><td class="num">' + secs(r.quick_s) + '</td><td class="num">' + secs(r.total_s) + '</td><td class="num">' + usd(r.usd) +
          '</td><td class="num">' + (r.tokens == null ? "—" : n(r.tokens)) + '</td><td class="num">' + (r.problems == null ? "—" : n(r.quick_problems) + " → " + n(r.problems)) +
          '</td><td class="num">' + n(r.updates) + "</td><td>" + esc((r.install_id || "").slice(0, 8)) + "</td></tr>" +
          (open ? '<tr><td class="detail" colspan="12">' + detail(r) + "</td></tr>" : "");
      }).join("") + "</tbody></table></div>";
  }

  // Bug reports and feedback (app/scripts/api/admin.mjs, sendFeedback): open ones first, click one for its whole text and pictures.
  function feedbackTable() {
    var all = data.feedback || [];
    var open = function (f) { return f.status === "pending" || f.status === "in progress" || !f.status; };
    var rows = all.filter(function (f) { return fbFilter === "all" || (fbFilter === "bug" ? f.kind === "bug" : open(f)); });
    var filters = [["open", "Open · " + all.filter(open).length], ["bug", "Bugs"], ["all", "All · " + all.length]].map(function (f) {
      return '<button class="btn" data-fbfilter="' + f[0] + '" aria-pressed="' + (fbFilter === f[0]) + '">' + f[1] + "</button>";
    }).join("");
    if (!rows.length) return '<div class="filters">' + filters + '</div><p class="empty">Nothing here</p>';
    return '<div class="filters">' + filters + '</div><div class="scroll"><table><thead><tr>' +
      "<th>When</th><th>Kind</th><th>Status</th><th>From</th><th>Message</th><th>Email</th><th class=\"num\">Pictures</th><th>Version</th><th>Machine</th>" +
      "</tr></thead><tbody>" + rows.map(function (f) {
        var isOpen = openFb === f.id;
        var pics = fbImages[f.id];
        return '<tr class="run' + (isOpen ? " open" : "") + '" data-fb="' + f.id + '">' +
          '<td title="' + esc(new Date(f.at).toLocaleString()) + '">' + when(f.at) + "</td>" +
          '<td><span class="tag ' + (f.kind === "bug" ? "bad" : "") + '">' + esc(f.kind) + "</span></td>" +
          '<td><select class="status" data-fbid="' + f.id + '" data-fbat="' + esc(f.at) + '">' + FB_STATUS.map(function (st) {
            return "<option" + ((f.status || "pending") === st ? " selected" : "") + ">" + st + "</option>";
          }).join("") + "</select></td>" +
          "<td>" + esc(f.source || "app") + '</td><td class="msg">' + esc(f.message.split("\n")[0]) + "</td>" +
          "<td>" + (f.email ? '<a href="mailto:' + esc(f.email) + '">' + esc(f.email) + "</a>" : "—") + '</td><td class="num">' + n(f.images || 0) + "</td>" +
          "<td>" + esc(f.app_version || "—") + "</td><td>" + esc((f.install_id || "").slice(0, 8)) + "</td></tr>" +
          (isOpen ? '<tr><td class="detail" colspan="9"><div class="detailIn">' +
            '<div class="wide"><h4>Message</h4><p class="fbText">' + esc(f.message) + "</p></div>" +
            '<div><h4>Sent</h4><div class="kv"><span>at</span><span>' + esc(new Date(f.at).toLocaleString()) + "</span><span>from</span><span>" + esc(f.source || "app") +
            "</span><span>system</span><span>" + esc(f.os || "—") + "</span><span>app</span><span>" + esc(f.app_version || "—") + "</span><span>machine</span><span>" + esc(f.install_id || "—") +
            (f.updated_at ? "</span><span>updated</span><span>" + esc(new Date(f.updated_at).toLocaleString()) : "") + "</span></div></div>" +
            (f.images ? '<div class="wide"><h4>Pictures</h4>' + (pics == null ? '<p class="empty">Loading…</p>' : pics.error ? '<p class="empty">' + esc(pics.error) + "</p>" :
              '<div class="shots">' + pics.map(function (src, i) {
                return /^data:image\/(png|jpeg|webp|gif);base64,/.test(src) ? '<a href="' + src + '" download="feedback-' + f.id + "-" + (i + 1) + '" title="Download"><img src="' + src + '" alt="Picture ' + (i + 1) + '"></a>' : "";
              }).join("") + "</div>") + "</div>" : "") +
            "</div></td></tr>" : "");
      }).join("") + "</tbody></table></div>";
  }

  function rerenderFeedback() { document.getElementById("feedback").innerHTML = feedbackTable(); }

  document.addEventListener("change", function (e) {
    var sel = e.target;
    if (!sel.dataset || !sel.dataset.fbid) return;
    var id = Number(sel.dataset.fbid), status = sel.value;
    sel.disabled = true;
    rpc("bp_admin_feedback_set", { pw: stored(), id: id, at: sel.dataset.fbat, status: status }).then(function (row) {
      data.feedback.forEach(function (f) { if (f.id === id && row) { f.status = row.status; f.updated_at = row.updated_at; } });
    }, function (err) { alert("Couldn't change it: " + err.message); }).then(rerenderFeedback);
  });

  function rerenderRuns() { document.getElementById("runs").innerHTML = runsTable(); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, tr.run");
    if (t && t.dataset.update) {
      var uid = Number(t.dataset.update);
      openUpdate = openUpdate === uid ? null : uid;
      return rerenderRuns();
    }
    if (!t) return;
    if (t.id === "refresh") { repoView = null; return load(stored()); }
    if (t.id === "back") { repoView = null; openRun = null; return rerenderRuns(); }
    if (t.dataset.repo) {
      var name = t.dataset.repo;
      var view = repoView = { name: name, runs: null };
      openRun = null;
      rerenderRuns();
      document.getElementById("runs").scrollIntoView({ block: "start" });
      rpc("bp_admin_repo", { pw: stored(), repo_name: name }).then(function (runs) { view.runs = runs; }, function (err) { view.error = err.message; })
        .then(function () { if (repoView === view) rerenderRuns(); });
      return;
    }
    if (t.id === "out") { keep(""); data = null; return gate(); }
    if (t.dataset.fbfilter) { fbFilter = t.dataset.fbfilter; openFb = null; return rerenderFeedback(); }
    if (t.dataset.fb) {
      if (e.target.closest("select, a")) return;
      var fid = Number(t.dataset.fb);
      openFb = openFb === fid ? null : fid;
      rerenderFeedback();
      var f = data.feedback.filter(function (x) { return x.id === fid; })[0];
      if (openFb && f && f.images && !fbImages[fid]) {
        rpc("bp_admin_feedback_images", { pw: stored(), id: fid }).then(function (r) { fbImages[fid] = r || []; }, function (err) { fbImages[fid] = { error: err.message }; })
          .then(function () { if (openFb === fid) rerenderFeedback(); });
      }
      return;
    }
    if (t.dataset.filter) { runFilter = t.dataset.filter; openRun = null; return rerenderRuns(); }
    if (t.dataset.run) {
      var id = Number(t.dataset.run);
      openRun = openRun === id ? null : id;
      openUpdate = null;
      rerenderRuns();
      if (openRun && !details[id]) {
        rpc("bp_admin_run", { pw: stored(), run_id: id }).then(function (r) { details[id] = r || { error: "That run is gone" }; }, function (err) { details[id] = { error: err.message }; })
          .then(function () { if (openRun === id) rerenderRuns(); });
      }
    }
  });

  stored() ? load(stored()) : gate();
})();
</script>
</body>
</html>
